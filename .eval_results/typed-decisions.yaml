  date: '2026-10-09'
  source:
    url: https://huggingface.co/Phocinae/Phocinae-Largha-150M-v1/blob/main/BENCHMARKS.md
    name: Phocinae self-host eval (BENCHMARKS.md)
    user: Phocinae
  notes: >
    Specialist: fitted on the Typed Decisions train split (mmBERT-small base) — NOT zero-shot;
    per the benchmark README this belongs to the "fitted/fine-tuned on train" table and is not
    comparable with the zero-shot table. Test split, 400 cases / 2,000 decisions, one request
    per case with the state and all five questions (README request shape), all answered, zero
    errors. Accuracy = agreement with the gold label. One forward pass per question, no generated
    tokens. Self-reported (self-host, no verifyToken). The submitted accuracy sits above the 0.735
    teacher self-agreement ceiling — per the README this indicates the model is learning the
    teacher's quirks (label-specificity), also probed via JevBench on the model card. zh
    (machine-translated test cases; the training mix includes machine-translated + native Chinese
    rows) has no benchmark task; see the model card.
    Training-overlap disclosure (corrected 2026-10-10; re-audited 2026-10-12): the fine-tune mix
    includes a 500-item error-correction pair pool mined from model predictions on this benchmark's
    test rows. Overlap with this test split: 500 / 2,000 decisions across 282 / 400 cases (S1MB
    typed-decisions subset: 82 / 100 cases, 151 / 500 decisions). This accuracy is therefore measured
    on a test split this lineage has partly seen — read as "fitted on train, test-exposed", not zero-shot.
    Full details: the model card's training-overlap disclosure. A clean re-score without the pool (same recipe,
    pairs swapped back out) measures 0.791 — published in the dataset discussion
    (2026-10-12).

