name: CI

# This repository publishes no package, so there is nothing to build or upload. What
# it does publish is a model card, a gallery and a set of verification tools, and the
# claims those tools make are checkable in CI:
#
#   * tools/audit_gallery_coverage.py      — the 27 demos are all accounted for, and the
#                                            counts in the gallery README match reality
#   * tools/audit_bilingual_sync.py        — the paired EN/ZH READMEs have not drifted
#   * tools/audit_package_version_consistency.py — every manifest in a release repo
#                                            declares the same version
#   * tools/verify_published.py            — the four PyPI packages work as installed
#
# Why this did not exist before, and why it does now: the tools needing PyPI access used
# to report *failures* when the registry was unreachable. I measured that — blocking the
# registry produced nine FAILs and exit 1 — and fixed it, so an offline run now SKIPs the
# lookups and says so instead of inventing a problem. A workflow that goes red because the
# network is flaky teaches people to ignore red.
#
# macos and windows are in the matrix on purpose. Three defects found in this project were
# platform-specific and invisible on Linux (POSIX shell under PowerShell, `python3` absent
# on Windows, a shell variable absorbing a CJK character) — tools that only ever ran on
# Linux were how those survived.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audits (py3.12 on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Everything below is standard library only, so there is nothing to install.
      # PYTHONUTF8 matters here for the same reason it does in phocinae-guard: these
      # scripts print Chinese summaries, and the Windows console default code page is
      # not UTF-8.
      - name: Gallery coverage (27 demos classified)
        env:
          PYTHONUTF8: '1'
        run: python tools/audit_gallery_coverage.py

      - name: Paired READMEs have not drifted
        env:
          PYTHONUTF8: '1'
        run: python tools/audit_bilingual_sync.py

      - name: Version consistency across this repo
        env:
          PYTHONUTF8: '1'
        run: python tools/audit_package_version_consistency.py .

      # The CLI's own dependencies, so its contract check actually runs. Without them the
      # check SKIPs (exit 0) — and a green row that verified nothing is precisely the
      # failure mode this repository keeps finding in other forms.
      - name: Install the CLI's and server's runtime dependencies
        id: pypath
        run: |
          # typer/rich/httpx for the CLI contract check; fastapi/uvicorn for the server one.
          #
          # torch is here because the server imports it before it looks for weights, so
          # without it the process dies with ModuleNotFoundError and never reaches the
          # diagnostic the check is looking for. That is not a heavyweight concession: the
          # CPU-only wheel is what pip resolves by default, and the assertion is about the
          # message printed when no weights are configured, not about inference.
          python -m pip install --quiet typer rich httpx fastapi uvicorn numpy torch
          echo "path=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_OUTPUT"

      # Runs the published wheel's CLI and asserts the exit-code contract the README
      # documents: 0 allow, 2 deny, 3 ask, plus the fail-closed behaviour when the
      # decision service is unreachable.
      - name: phocinae-cli documented contract
        env:
          PYTHONUTF8: '1'
          # Pin the interpreter the subprocesses use to the one that just received
          # typer/rich/httpx. Relying on sys.executable matching the interpreter on PATH
          # was an assumption, and on the runner it was wrong: the children reported
          # "No module named phocinae_cli" for all five gate cases, which reads as five
          # protocol failures rather than one environment mismatch.
          PHOC_CHECK_PYTHON: ${{ steps.pypath.outputs.path }}
        run: python tools/check_cli_documented_contract.py

      # Every pre-release check in one place, so the set cannot silently shrink to whatever
      # someone remembers to run. Suites whose checkouts are absent here are reported as
      # SKIP with the reason; a run in which nothing executes fails outright.
      - name: verify_all (the whole pre-release set, one command)
        env:
          PYTHONUTF8: '1'
          PHOC_CLI_PYTHON: ${{ steps.pypath.outputs.path }}
          PHOC_SERVER_PYTHON: ${{ steps.pypath.outputs.path }}
          PHOC_GUARD_REPO: .phoc-guard
        run: python tools/verify_all.py

      # NOT run here: tools/audit_doc_claims_have_tests.py compares the four package
      # repositories against each other, and this job checks out only this one. Pointed at
      # an empty tree it would find no targets and report success having compared nothing —
      # the same shape of false pass this workflow exists to avoid. Run it where the four
      # sibling checkouts are present.

      # Downloads each released wheel from PyPI, unpacks it and exercises it the way a
      # user would. This is the check that caught three defects which were invisible in
      # the source tree (a wheel missing its allowlist, a stale hand-copied table, and a
      # Windows-only `python3` assumption).
      - name: Published artifacts behave as installed
        env:
          PYTHONUTF8: '1'
        run: python tools/verify_published.py

      # The documented API of the published server. With no weights this verifies the
      # startup diagnostic — the server must exit with a message naming PHOC_MODEL_DIR and
      # how to fetch them, rather than half-starting — and reports the endpoints it could
      # not exercise. On a machine with PHOC_MODEL_DIR set it tests all five endpoints, the
      # bearer-token contract, the 413 limit and the batch boundary.
      - name: phocinae-server documented API
        env:
          PYTHONUTF8: '1'
          PHOC_CHECK_PYTHON: ${{ steps.pypath.outputs.path }}
        run: python tools/check_server_documented_api.py

      # guard.conf.example.json ships in the repository rather than the wheel (the README
      # has you copy it from a checkout), so the guard check needs that checkout to verify
      # that the config file is actually read. Without it the config assertions skip.
      - name: Check out phocinae-guard for its example config
        uses: actions/checkout@v4
        with:
          repository: Phocinae/phocinae-guard
          path: .phoc-guard

      # Exit codes, the two invariants (only allow passes; --confirm cannot override deny),
      # the fail-closed behaviour with no service, the JSON-by-default output, the audit
      # file, and that a config value really changes the decision.
      - name: phocinae-guard documented contract
        env:
          PYTHONUTF8: '1'
          PHOC_CHECK_PYTHON: ${{ steps.pypath.outputs.path }}
          PHOC_GUARD_REPO: .phoc-guard
        run: python tools/check_guard_documented_contract.py

      # Every `--flag` written in the four packages' README examples must exist in the real
      # CLI. A reader who types an example has no way to tell that it was never run; this
      # check reads the option set from `--help` and compares. Packages whose examples
      # cannot be checked here are reported as not verified rather than passed.
      - name: README examples name real flags
        env:
          PYTHONUTF8: '1'
          PHOC_CHECK_PYTHON: ${{ steps.pypath.outputs.path }}
        run: python tools/audit_readme_examples.py
